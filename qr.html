<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link → QR</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    label, input, button { font-size: 1rem; }
    .row { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: .5rem; }
    button { padding: .6rem 1rem; border: 0; border-radius: .5rem; cursor: pointer; }
    #qr { margin-top: 1rem; text-align: center; }
    #qr img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Make a QR from a Link</h1>
  <div class="row">
    <input id="url" type="url" placeholder="https://example.com" />
    <button id="go">Generate</button>
  </div>
  <div id="qr"></div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    $("#go").addEventListener("click", () => {
      const data = $("#url").value.trim();
      if (!data) return alert("Enter a link first.");
      // Uses a public QR image API. Adjust size as you like.
      const size = "300x300";
      const src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}&data=${encodeURIComponent(data)}`;
      $("#qr").innerHTML = `<p><strong>QR for:</strong> ${data}</p><img alt="QR code" src="${src}">`;
    });
  </script>
</body>
</html>
